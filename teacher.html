<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>교사 대시보드 · 다각형의 내각과 외각</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page teacher-page">
    <section class="card">
      <h1>교사 대시보드</h1>
      <p>Supabase Auth에 만든 교사 계정으로 로그인합니다.</p>
      <form id="teacherLogin" class="general-grid compact">
        <label>이메일<input id="email" type="email" required /></label>
        <label>비밀번호<input id="password" type="password" required /></label>
        <button class="primary" type="submit">로그인</button>
      </form>
      <div id="teacherMsg" class="feedback"></div>
    </section>

    <section id="controlPanel" class="card" hidden>
      <div class="dashboard-head"><div><h2>활동 열기 / 잠그기</h2><p>학생은 여기서 열린 활동만 조작할 수 있습니다.</p></div><button id="lockAll" class="secondary" type="button">모두 잠그기</button></div>
      <div id="stepControls" class="step-controls"></div>
    </section>

    <section id="dashboard" class="card" hidden>
      <div class="dashboard-head"><div><h2>학생 접속 현황</h2><p>최근 45초 안에 신호가 있으면 ‘접속 중’으로 표시합니다.</p></div><button id="refresh" class="primary small" type="button">새로고침</button></div>
      <div class="stat-row"><div><span>접속 중</span><strong id="onlineCount">0</strong></div><div><span>최근 세션</span><strong id="sessionCount">0</strong></div><div><span>제출 완료</span><strong id="submittedCount">0</strong></div></div>
      <div class="table-wrap"><table id="sessionTable" class="dashboard-table"></table></div>
    </section>
  </main>
  <script type="module" src="./teacher.js"></script>
</body>
</html>
