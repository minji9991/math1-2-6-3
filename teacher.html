<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사 대시보드</title><link rel="stylesheet" href="./styles.css"></head>
<body>
  <main class="page" style="padding-top:36px">
    <section class="card">
      <h1>교사 대시보드</h1>
      <p>Supabase Auth에 만든 교사 계정으로 로그인합니다.</p>
      <form id="teacherLogin" class="general-grid">
        <label>이메일<input id="email" type="email" required></label>
        <label>비밀번호<input id="password" type="password" required></label>
        <button class="primary" type="submit">로그인</button>
      </form>
      <div id="teacherMsg" class="feedback"></div>
    </section>
    <section id="dashboard" class="card" hidden>
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>학생 접속 현황</h2><button id="refresh" class="primary small" type="button">새로고침</button></div>
      <div style="overflow:auto"><table id="sessionTable" style="width:100%;border-collapse:collapse;min-width:680px"></table></div>
    </section>
  </main>
  <script type="module" src="./teacher.js"></script>
</body></html>
